[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fourchar-radar"
version = "0.1.0"
description = "Radar for free 4-character Discord usernames: availability checks, price estimation and webhook alerts."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "PastyNew" }]
keywords = ["discord", "username", "monitoring", "radar", "alerts"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
  "Typing :: Typed",
]

# Core runtime deps are kept deliberately small: everything else is stdlib.
dependencies = [
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
]

[project.optional-dependencies]
# The Discord bot (slash commands) is optional -- webhook mode needs no bot at all.
bot = ["discord.py>=2.3,<3.0"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
fourchar-radar = "fourchar_radar.cli:main"

[project.urls]
Homepage = "https://github.com/PastyNew/fourchar-radar"
Repository = "https://github.com/PastyNew/fourchar-radar"
Issues = "https://github.com/PastyNew/fourchar-radar/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/fourchar_radar"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/CHANGELOG.md", "/LICENSE"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "RET", "SIM"]
# S101: asserts are the point of the test suite.
# S311: `random` is used only for pacing jitter and backoff spread, never for
#       anything that needs to be unpredictable.
ignore = ["S101", "S311"]

[tool.ruff.lint.per-file-ignores]
# S105/S106: test fixtures legitimately contain things shaped like secrets.
# S108: tests use /tmp paths as literal CLI arguments.
"tests/*" = ["S105", "S106", "S108"]

# --------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
packages = ["fourchar_radar"]
strict = true
warn_unreachable = true

# `ignore_missing_imports` for the bot extra is deliberately NOT a substitute for
# installing it. With discord.py absent, every discord type resolves to `Any`,
# mypy has nothing to check, and bot.py looks clean while being wrong. Always
# `make dev` (or `uv sync --all-extras`) before trusting a mypy run.

[[tool.mypy.overrides]]
module = ["discord.*"]
ignore_missing_imports = true

# discord.py's CommandTree decorators are not type-annotated, so every
# slash-command function is "untyped" as far as mypy is concerned. That is a
# property of the library, not of this code.
[[tool.mypy.overrides]]
module = ["fourchar_radar.notify.bot"]
disable_error_code = ["untyped-decorator", "no-untyped-call"]

# -------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
