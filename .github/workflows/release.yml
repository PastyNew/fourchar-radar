name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-release:
    name: github release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - name: Verify the artifacts
        run: uvx twine check dist/*
      - name: Attach artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true

  # PyPI is not set up for this project, and the one-line installer falls back
  # to the GitHub archive, so publishing is off by default rather than red on
  # every tag. To enable it: create the `pypi` environment, add a trusted
  # publisher for this repo, then set `enabled: true` below.
  pypi:
    name: publish to pypi
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
